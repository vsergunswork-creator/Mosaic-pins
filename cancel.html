<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment canceled</title>
  <script id="mp-i18n-preload">
    (() => {
      try {
        const lang = String(localStorage.getItem("mp_language") || "en").toLowerCase();
        if (lang !== "en") {
          document.documentElement.classList.add("mp-i18n-pending");
          window.setTimeout(() => {
            document.documentElement.classList.remove("mp-i18n-pending");
          }, 2000);
        }
      } catch (_) {}
    })();
  </script>
  <style id="mp-i18n-preload-style">
    html{background:#0b0d11}
    html.mp-i18n-pending body{visibility:hidden}
  </style>
</head>
<body style="font-family:system-ui; background:#0b0d11; color:#e9eef7; padding:24px;">
  <h1 style="margin:0 0 10px;">❌ Payment canceled</h1>
  <p style="color:#a8b3c7; margin:0 0 18px;">No worries — you can try again.</p>

  <p style="margin:0 0 18px;">
    <a href="/" style="color:#60a5fa; text-decoration:none; font-weight:700;">← Back to home</a>
  </p>

  <script src="/assets/js/cancel.js"></script>
  <script src="/assets/js/site-common.js?v=20260818-static-all1"></script>
</body>
</html>
